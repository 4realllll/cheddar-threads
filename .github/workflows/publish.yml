name: Публикация в Threads

on:
  push:
    branches: [main]
    paths: ["posts/queue/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опубликовать очередь
        id: pub
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/publish.py
        continue-on-error: true
      - name: Сохранить опубликованное
        run: |
          git config user.name "cheddar-bot"
          git config user.email "cheddar-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "Опубликовано в Threads"
          git pull --rebase
          git push
      - name: Сообщить об ошибке
        if: steps.pub.outcome == 'failure'
        run: exit 1
