name: Статистика Threads

on:
  schedule:
    - cron: "23 5 * * *"  # каждый день 08:23 МСК, до утреннего поста
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать статистику
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 scripts/stats.py
      - name: Сохранить
        run: |
          git config user.name "cheddar-bot"
          git config user.email "cheddar-bot@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Статистика $(date -u +%F)"
          git pull --rebase
          git push
