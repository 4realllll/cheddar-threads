name: Комментарии Threads

# fetch — каждые 10 минут собирает новые комментарии в replies/inbox.md (коммит только при изменениях)
# send — опубликовать ответы, когда задача кладёт их в replies/outbox/
on:
  schedule:
    - cron: "*/10 * * * *"  # каждые 10 минут собираем новые комментарии (бесплатно в публичном репозитории)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["replies/outbox/**"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отправить ответы
        id: send
        if: github.event_name == 'push'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 scripts/send_replies.py
        continue-on-error: true
      - name: Собрать комментарии
        id: fetch
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 scripts/fetch_replies.py
        continue-on-error: true
      - name: Сохранить
        run: |
          git config user.name "cheddar-bot"
          git config user.email "cheddar-bot@users.noreply.github.com"
          git add replies
          git diff --cached --quiet || git commit -m "Комментарии $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
      - name: Сообщить об ошибке
        if: steps.send.outcome == 'failure' || steps.fetch.outcome == 'failure'
        run: exit 1
